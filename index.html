<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141a33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Corrida Turbo</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <!-- Canvas do jogo (Phaser) -->
  <div id="game-root"></div>

  <!-- HUD durante a corrida (DOM por cima do canvas) -->
  <div id="hud" class="hidden">
    <div class="hud-top safe-top">
      <div class="hud-me">
        <div id="hud-dist" class="hud-dist">0 m</div>
        <div class="hud-sub">
          <span id="hud-coins">🪙 0</span>
          <span id="hud-lives">❤️❤️❤️</span>
        </div>
      </div>
      <div id="hud-opp" class="hud-opp hidden">
        <div class="hud-opp-name" id="hud-opp-name">Rival</div>
        <div class="hud-opp-info">
          <span id="hud-opp-delta">0 m</span>
          <span id="hud-opp-lives">❤️❤️❤️</span>
        </div>
      </div>
    </div>
    <div id="hud-msg" class="hud-msg hidden"></div>
  </div>

  <!-- Overlay de countdown -->
  <div id="countdown" class="overlay hidden">
    <div id="countdown-num" class="countdown-num">3</div>
  </div>

  <!-- Telas de UI -->
  <div id="ui-root"></div>

  <!-- Aviso de orientação -->
  <div id="rotate-overlay">
    <div class="rotate-phone">📱</div>
    <p>Vire o celular para jogar</p>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

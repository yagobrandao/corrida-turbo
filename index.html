<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141a33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Party Hub</title>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <!-- canvas dos jogos que usam Phaser -->
  <div id="game-root"></div>

  <!-- palco DOM, para jogos sem canvas -->
  <div id="game-dom" class="hidden"></div>

  <!-- HUD: o painel é montado pelo jogo, o placar é compartilhado -->
  <div id="hud" class="hidden">
    <div class="hud-top safe-top">
      <div id="hud-panel"></div>
      <div class="hud-right">
        <button id="hud-pause" class="pause-btn" aria-label="Pausar">⏸</button>
        <div id="hud-board" class="hud-board"></div>
      </div>
    </div>
    <div id="hud-msg" class="hud-msg hidden"></div>
  </div>

  <div id="countdown" class="overlay hidden">
    <div id="countdown-num" class="countdown-num">3</div>
  </div>

  <!-- telas da Central de Jogos -->
  <div id="ui-root"></div>

  <div id="rotate-overlay">
    <div class="rotate-phone">📱</div>
    <p>Vire o celular para jogar</p>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
